[package]
name = "mysql-executor"
version = "1.0.0"
edition = "2021"
authors = ["MySQL Executor Team"]
description = "A Rust-based MySQL file executor that scans and executes SQL files, generating JSON results"
license = "MIT"

[dependencies]
# MySQL driver
mysql = "25.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"

# File system operations
walkdir = "2.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Date/Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Concurrency
rayon = "1.8"
parking_lot = "0.12"

# File locking
fs2 = "0.4"

# UUID for temp files
uuid = { version = "1.6", features = ["v4"] }

# Base64 encoding for binary data
base64 = "0.21"

[dev-dependencies]
tempfile = "3.9"
mockall = "0.12"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
